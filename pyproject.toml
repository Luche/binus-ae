[project]
name = "binus-ae"
version = "0.2.0"
description = "Automates BINUS Activity Enrichment supervisor approvals (logbooks, assignments, final reports) and writes a progress tracker page."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
binus-ae = "binus_ae:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["binus_ae.py"]

# Never ship local data (.env, browser sessions, logs, screenshots) in a source package.
[tool.hatch.build.targets.sdist]
only-include = ["binus_ae.py", "README.md", "pyproject.toml", "uv.lock"]
